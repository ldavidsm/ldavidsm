name: Contribution snake

# Genera la animacion de la serpiente comiendose el grafico de contribuciones y
# la publica en la rama "output", que es de donde la lee el README.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/python-snake.svg?color_snake=#FFD43B&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/python-snake-dark.svg?color_snake=#FFD43B&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
