name: Profile summary cards

# El README apunta a profile-summary-card-output/github/*.svg. Esos ficheros no
# existen por si solos: los genera esta Action y los commitea al repo. Sin ella
# el perfil ensena cuatro imagenes roras.

on:
  schedule:
    - cron: "17 4 * * *"      # a diario, de madrugada
  workflow_dispatch:          # y a mano cuando quieras
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 2
